<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Número Secreto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Adivina el Número Secreto</h1>
    <p>Ingresa un número del 1 al 100 para intentar adivinar el número secreto:</p>
    <input type="text" id="numberInput" placeholder="Ingresa un número">
    <button onclick="checkNumber()">Adivinar</button>
    <div class="message" id="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
